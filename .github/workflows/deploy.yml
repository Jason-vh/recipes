name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: recipes-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DEPLOY_DIR: /home/exedev/apps/recipes

jobs:
  deploy:
    name: Deploy to exe.dev VM
    runs-on: [self-hosted, linux, recipes-prod]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write production env file
        run: |
          cat > .env.production <<EOF
          APP_URL=https://recipes.vhtm.eu
          APP_SECRET=${{ secrets.APP_SECRET }}
          DATABASE_URL=postgresql://recipes:${{ secrets.RECIPES_DB_PASSWORD }}@postgres:5432/recipes
          RECIPES_APP_HOST_PORT=3002
          COMPOSE_PROJECT_NAME=recipes
          EOF

      - name: Copy checkout to stable deploy directory
        run: |
          rm -rf "$DEPLOY_DIR.tmp"
          mkdir -p "$DEPLOY_DIR.tmp"
          cp -a . "$DEPLOY_DIR.tmp/"
          rm -rf "$DEPLOY_DIR"
          mv "$DEPLOY_DIR.tmp" "$DEPLOY_DIR"

      - name: Deploy with Docker Compose
        run: |
          cd "$DEPLOY_DIR"
          docker compose --env-file .env.production up -d --build --remove-orphans
          docker compose --env-file .env.production ps

      - name: Reload Caddy (picks up deploy/caddy.snippet)
        run: |
          sudo /usr/bin/caddy validate --config /etc/caddy/Caddyfile
          sudo /usr/bin/systemctl reload caddy
